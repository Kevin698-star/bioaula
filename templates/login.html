<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioAula · Iniciar sesión</title>
  <meta name="description" content="Inicia sesión en BioAula, la plataforma educativa de biología con IA generativa.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080d0a;
      --surface:   #0f1a12;
      --card:      rgba(255,255,255,0.035);
      --card-border: rgba(74,222,128,0.12);
      --accent:    #4ade80;
      --accent2:   #22c55e;
      --accent-glow: rgba(74,222,128,0.18);
      --text1:     #f0fdf4;
      --text2:     #a3c4a8;
      --text3:     #5a8a68;
      --danger:    #f87171;
      --danger-glow: rgba(248,113,113,0.15);
      --input-bg:  rgba(255,255,255,0.04);
      --input-border: rgba(74,222,128,0.15);
      --input-focus: rgba(74,222,128,0.35);
      --radius:    14px;
      --radius-sm: 8px;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text1);
      overflow: hidden;
    }

    /* ── Background orbs ── */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .bg-orb-1 {
      width: 480px; height: 480px;
      background: radial-gradient(circle, rgba(74,222,128,0.12) 0%, transparent 70%);
      top: -120px; left: -100px;
      animation: drift1 12s ease-in-out infinite alternate;
    }
    .bg-orb-2 {
      width: 360px; height: 360px;
      background: radial-gradient(circle, rgba(34,197,94,0.08) 0%, transparent 70%);
      bottom: -80px; right: -80px;
      animation: drift2 15s ease-in-out infinite alternate;
    }
    @keyframes drift1 { 0%{transform:translate(0,0)} 100%{transform:translate(40px,30px)} }
    @keyframes drift2 { 0%{transform:translate(0,0)} 100%{transform:translate(-30px,-20px)} }

    /* ── Grid pattern ── */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(74,222,128,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,222,128,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* ── Layout ── */
    .auth-wrapper {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Logo / Brand ── */
    .brand-link { text-decoration: none; display: flex; align-items: center; gap: 0.6rem; justify-content: center; }
    .brand-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .brand-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text1);
      letter-spacing: -0.5px;
    }

    /* ── Card ── */
    .auth-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.25rem 2rem;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(74,222,128,0.04) inset,
        0 20px 60px rgba(0,0,0,0.5),
        0 0 40px rgba(74,222,128,0.04);
    }

    /* ── Card header ── */
    .auth-header { margin-bottom: 2rem; }
    .auth-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text1);
      letter-spacing: -0.5px;
      line-height: 1.2;
    }
    .auth-subtitle {
      font-size: 0.875rem;
      color: var(--text2);
      margin-top: 0.35rem;
      line-height: 1.5;
    }

    /* ── Form fields ── */
    .form-field {
      margin-bottom: 1.25rem;
      position: relative;
    }

    .form-label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text2);
      margin-bottom: 0.5rem;
      letter-spacing: 0.02em;
    }
    .form-label .label-icon { font-size: 0.95rem; }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      padding: 0.75rem 2.75rem 0.75rem 0.9rem;
      font-family: inherit;
      font-size: 0.9375rem;
      color: var(--text1);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .form-input::placeholder { color: var(--text3); }
    .form-input:focus {
      border-color: var(--input-focus);
      background: rgba(74,222,128,0.05);
      box-shadow: 0 0 0 3px rgba(74,222,128,0.08);
    }
    .form-input.is-valid {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px rgba(34,197,94,0.1);
    }
    .form-input.is-invalid {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px var(--danger-glow);
    }

    /* Toggle password */
    .toggle-pass {
      position: absolute; right: 0.75rem;
      background: none; border: none;
      color: var(--text3); cursor: pointer;
      padding: 0.25rem; line-height: 1;
      font-size: 1rem;
      transition: color var(--transition);
    }
    .toggle-pass:hover { color: var(--accent); }

    /* Validation hint */
    .field-hint {
      font-size: 0.76rem;
      margin-top: 0.375rem;
      color: var(--text3);
      min-height: 1rem;
      transition: color var(--transition);
    }
    .field-hint.error { color: var(--danger); }
    .field-hint.success { color: var(--accent2); }

    /* ── Submit button ── */
    .btn-submit {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem 1.5rem;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #0a1a0e;
      font-family: 'Syne', sans-serif;
      font-size: 0.9375rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 4px 24px rgba(74,222,128,0.25);
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn-submit:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 32px rgba(74,222,128,0.35);
    }
    .btn-submit:active:not(:disabled) { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Spinner */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(10,26,14,0.3);
      border-top-color: #0a1a0e;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn-submit.loading .spinner { display: block; }
    .btn-submit.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer link ── */
    .auth-footer {
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text3);
    }
    .auth-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: color var(--transition);
    }
    .auth-footer a:hover { color: var(--text1); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 1.5rem; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(15,26,18,0.95);
      border: 1px solid rgba(74,222,128,0.2);
      border-radius: 12px;
      padding: 0.75rem 1.25rem;
      font-size: 0.875rem;
      color: var(--text1);
      backdrop-filter: blur(12px);
      z-index: 9999;
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.35s ease;
      max-width: calc(100vw - 2rem);
      white-space: nowrap;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.error { border-color: rgba(248,113,113,0.35); color: #fca5a5; }
    #toast.success { border-color: rgba(74,222,128,0.35); color: var(--accent); }

    @media (max-width: 480px) {
      .auth-card { padding: 1.75rem 1.25rem; }
      .auth-title { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div id="toast" role="alert" aria-live="polite"></div>

  <main class="auth-wrapper">
    <div class="auth-container">

      <!-- Brand -->
      <a href="/" class="brand-link" aria-label="Ir al inicio">
        <div class="brand-icon">🌿</div>
        <span class="brand-name">BioAula</span>
      </a>

      <!-- Card -->
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Bienvenido de vuelta</h1>
          <p class="auth-subtitle">Ingresa tus credenciales para continuar</p>
        </div>

        <form id="login-form" onsubmit="return false;" novalidate>

          <div class="form-field">
            <label class="form-label" for="login-email">
              <span class="label-icon">✉️</span> Correo electrónico
            </label>
            <div class="input-wrapper">
              <input
                type="email"
                id="login-email"
                class="form-input"
                placeholder="correo@ejemplo.com"
                autocomplete="email"
                aria-required="true"
                aria-describedby="email-hint"
              >
            </div>
            <div class="field-hint" id="email-hint"></div>
          </div>

          <div class="form-field">
            <label class="form-label" for="login-pass">
              <span class="label-icon">🔒</span> Contraseña
            </label>
            <div class="input-wrapper">
              <input
                type="password"
                id="login-pass"
                class="form-input"
                placeholder="••••••••"
                autocomplete="current-password"
                aria-required="true"
                aria-describedby="pass-hint"
              >
              <button
                type="button"
                class="toggle-pass"
                id="toggle-pass-btn"
                aria-label="Mostrar/ocultar contraseña"
              >👁️</button>
            </div>
            <div class="field-hint" id="pass-hint"></div>
          </div>

          <button
            type="submit"
            class="btn-submit"
            id="login-btn"
            onclick="doLogin()"
          >
            <div class="spinner" aria-hidden="true"></div>
            <span class="btn-text">Iniciar sesión →</span>
          </button>
        </form>
      </div>

      <p class="auth-footer">
        ¿No tienes cuenta?
        <a href="/register">Regístrate gratis</a>
      </p>

    </div>
  </main>

<script>
// ── Toggle password visibility ──────────────────────────────────
const toggleBtn = document.getElementById('toggle-pass-btn');
const passInput = document.getElementById('login-pass');
toggleBtn.addEventListener('click', () => {
  const isHidden = passInput.type === 'password';
  passInput.type = isHidden ? 'text' : 'password';
  toggleBtn.textContent = isHidden ? '🙈' : '👁️';
});

// ── Live validation ──────────────────────────────────────────────
function setFieldState(input, hint, state, msg) {
  input.classList.remove('is-valid', 'is-invalid');
  hint.classList.remove('error', 'success');
  if (state === 'valid') {
    input.classList.add('is-valid');
    hint.classList.add('success');
    hint.textContent = msg || '';
  } else if (state === 'invalid') {
    input.classList.add('is-invalid');
    hint.classList.add('error');
    hint.textContent = msg || '';
  } else {
    hint.textContent = '';
  }
}

const emailInput = document.getElementById('login-email');
const emailHint  = document.getElementById('email-hint');
const passHint   = document.getElementById('pass-hint');

emailInput.addEventListener('blur', () => {
  const v = emailInput.value.trim();
  if (!v) {
    setFieldState(emailInput, emailHint, 'invalid', 'El correo es requerido');
  } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
    setFieldState(emailInput, emailHint, 'invalid', 'Formato de correo inválido');
  } else {
    setFieldState(emailInput, emailHint, 'valid', '');
  }
});

passInput.addEventListener('blur', () => {
  if (!passInput.value) {
    setFieldState(passInput, passHint, 'invalid', 'La contraseña es requerida');
  } else {
    setFieldState(passInput, passHint, 'valid', '');
  }
});

// ── Submit ───────────────────────────────────────────────────────
async function doLogin() {
  const correo   = emailInput.value.trim();
  const password = passInput.value;
  const btn      = document.getElementById('login-btn');

  // Validación previa
  let valid = true;
  if (!correo || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) {
    setFieldState(emailInput, emailHint, 'invalid', 'Ingresa un correo válido');
    valid = false;
  }
  if (!password) {
    setFieldState(passInput, passHint, 'invalid', 'La contraseña es requerida');
    valid = false;
  }
  if (!valid) return;

  btn.disabled = true;
  btn.classList.add('loading');

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ correo, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error al iniciar sesión');

    localStorage.setItem('bioaula_token', data.token);
    localStorage.setItem('bioaula_user', JSON.stringify(data.user));
    showToast('¡Bienvenido! Redirigiendo…', 'success');
    setTimeout(() => window.location.href = '/', 800);
  } catch (e) {
    showToast(e.message, 'error');
    btn.disabled = false;
    btn.classList.remove('loading');
    setFieldState(passInput, passHint, 'invalid', 'Credenciales incorrectas');
  }
}

// Allow Enter key submit
document.getElementById('login-form').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});

// ── Toast ────────────────────────────────────────────────────────
function showToast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = type;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3200);
}
</script>
</body>
</html>
